<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste de Personalidade</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' }
    </script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body { font-family: 'Inter', sans-serif; transition: background-color 0.3s, color 0.3s; }
        .glass-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        .dark .glass-card {
            background: rgba(17, 24, 39, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .option-btn { transition: all 0.2s ease-in-out; }
        .option-btn:hover { transform: translateY(-2px); }
    </style>
</head>
<body class="bg-gradient-to-br from-indigo-50 via-slate-100 to-purple-50 dark:from-slate-950 dark:via-slate-900 dark:to-indigo-950 text-slate-800 dark:text-slate-100 min-h-screen flex flex-col justify-between">

    <!-- Cabeçalho -->
    <header class="w-full max-w-5xl mx-auto px-4 py-6 flex justify-between items-center">
        <div class="flex items-center space-x-3 cursor-pointer" onclick="resetQuiz()">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-600 to-purple-500 flex items-center justify-center text-white shadow-lg">
                <i class="fa-solid fa-brain text-xl"></i>
            </div>
            <span class="font-bold text-xl tracking-tight text-indigo-600 dark:text-indigo-400">Teste de Personalidade</span>
        </div>
        <button onclick="toggleTheme()" class="p-3 rounded-full glass-card hover:shadow-md transition-all text-slate-600 dark:text-slate-300 focus:outline-none" aria-label="Alternar tema">
            <i class="fa-solid fa-moon text-lg dark:hidden"></i>
            <i class="fa-solid fa-sun text-lg hidden dark:inline"></i>
        </button>
    </header>

    <main class="w-full max-w-3xl mx-auto px-4 my-auto py-8">

        <!-- 1. INÍCIO -->
        <div id="startScreen" class="glass-card rounded-3xl p-8 md:p-12 shadow-2xl text-center space-y-8">
            <div class="inline-flex items-center gap-2 px-4 py-2 rounded-full bg-indigo-500/10 text-indigo-600 dark:text-indigo-400 font-medium text-sm">
                <i class="fa-solid fa-sparkles"></i> Teste de Personalidade
            </div>
            <h1 class="text-3xl md:text-5xl font-extrabold tracking-tight leading-tight">
                Descobre o teu perfil psicológico dominante
            </h1>
            <p class="text-slate-600 dark:text-slate-300 text-base md:text-lg max-w-2xl mx-auto leading-relaxed">
                Responde a 5 perguntas breves sobre os teus comportamentos e preferências do dia a dia.
            </p>
            <div class="pt-6">
                <button onclick="startQuiz()" class="w-full sm:w-auto px-10 py-4 rounded-2xl bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-700 hover:to-purple-700 text-white font-bold text-lg shadow-xl transition-all">
                    Iniciar Teste <i class="fa-solid fa-arrow-right ml-2 text-sm"></i>
                </button>
            </div>
        </div>

        <!-- 2. QUESTIONÁRIO -->
        <div id="quizScreen" class="hidden glass-card rounded-3xl p-6 md:p-10 shadow-2xl space-y-8">
            <div class="space-y-3">
                <div class="flex justify-between items-center text-sm font-semibold">
                    <span id="questionProgressText" class="text-indigo-600 dark:text-indigo-400">Pergunta 1 de 5</span>
                    <span id="percentageText" class="text-slate-400">20%</span>
                </div>
                <div class="w-full bg-slate-200 dark:bg-slate-800 rounded-full h-2.5 overflow-hidden">
                    <div id="progressBar" class="bg-gradient-to-r from-indigo-500 to-purple-600 h-2.5 rounded-full transition-all duration-300" style="width: 20%"></div>
                </div>
            </div>

            <div class="space-y-6 min-h-[260px] flex flex-col justify-between">
                <h2 id="questionText" class="text-xl md:text-2xl font-bold leading-snug"></h2>
                <div class="space-y-3 my-4">
                    <button onclick="selectOption(5)" class="option-btn w-full p-4 rounded-xl border border-slate-200 dark:border-slate-800 hover:border-indigo-500 bg-white/40 dark:bg-slate-900/
